<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Exam System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" routerLink="/login">Login</a>
        </li>
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" routerLink="/register">Register</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn()">
          <a class="nav-link" routerLink="/exams">Exams</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn() && !isAdmin()" >
          <a class="nav-link" routerLink="/results">Results</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn() && isAdmin()">
          <a class="nav-link" routerLink="/all-results">All resuts</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn() && isAdmin()">
          <a class="nav-link" routerLink="/admin">Admin Dashboard</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn()">
          <a class="nav-link" (click)="logout()" style="cursor: pointer;">Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
