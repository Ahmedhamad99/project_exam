
<div class="container">
  <mat-card>
    <mat-card-title>All Students' Exam Results</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="studentsResults" class="mat-elevation-z8" *ngIf="studentsResults.length; else noResults">
        <!-- Username Column -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Student</th>
          <td mat-cell *matCellDef="let result">{{ result.username }}</td>
        </ng-container>

        <!-- Exam Title Column -->
        <ng-container matColumnDef="examTitle">
          <th mat-header-cell *matHeaderCellDef>Exam</th>
          <td mat-cell *matCellDef="let result">{{ result.examTitle }}</td>
        </ng-container>

        <!-- Score Column -->
        <ng-container matColumnDef="score">
          <th mat-header-cell *matHeaderCellDef>Score</th>
          <td mat-cell *matCellDef="let result">{{ result.score }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <ng-template #noResults>
        <p>No results available.</p>
      </ng-template>
    </mat-card-content>
  </mat-card>
</div>
