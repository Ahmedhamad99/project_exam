<div class="container py-5">
  <!-- نموذج إنشاء الامتحان -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Create Exam</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="examForm" (ngSubmit)="addExam()">
        <div class="mb-3">
          <label for="examTitle" class="form-label">Title</label>
          <input type="text" class="form-control" id="examTitle" formControlName="title" required>
          <div *ngIf="examForm.get('title')?.invalid && examForm.get('title')?.touched" class="text-danger">
            Title is required.
          </div>
        </div>
        <div class="mb-3">
          <label for="examDescription" class="form-label">Description</label>
          <input type="text" class="form-control" id="examDescription" formControlName="description">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="examForm.invalid">
          <i class="bi bi-save me-2"></i>Add Exam
        </button>
      </form>
    </div>
  </div>

  <!-- نموذج إضافة السؤال -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0"><i class="bi bi-question-circle me-2"></i>Add Question</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="questionForm" (ngSubmit)="addQuestion()">
        <div class="mb-3">
          <label for="examId" class="form-label">Select Exam</label>
          <select class="form-select" id="examId" formControlName="examId" required>
            <option value="">-- Select an Exam --</option>
            <option *ngFor="let exam of exams; trackBy: trackByFn" [value]="exam._id">{{ exam.title }}</option>
          </select>
          <div *ngIf="questionForm.get('examId')?.invalid && questionForm.get('examId')?.touched" class="text-danger">
            Please select an exam.
          </div>
        </div>
        <div class="mb-3">
          <label for="questionText" class="form-label">Question Text</label>
          <input type="text" class="form-control" id="questionText" formControlName="text" required>
          <div *ngIf="questionForm.get('text')?.invalid && questionForm.get('text')?.touched" class="text-danger">
            Question text is required.
          </div>
        </div>
        <div formArrayName="options">
          <div *ngFor="let option of options.controls; let i = index; trackBy: trackByFn" class="mb-3">
            <label for="option{{i}}" class="form-label">Option {{ i + 1 }}</label>
            <input type="text" class="form-control" id="option{{i}}" [formControlName]="i" required>
            <div *ngIf="options.controls[i].invalid && options.controls[i].touched" class="text-danger">
              Option {{ i + 1 }} is required.
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="correctAnswer" class="form-label">Correct Answer</label>
          <input type="text" class="form-control" id="correctAnswer" formControlName="correctAnswer" required>
          <div *ngIf="questionForm.get('correctAnswer')?.invalid && questionForm.get('correctAnswer')?.touched" class="text-danger">
            Correct answer is required.
          </div>
        </div>
        <button type="submit" class="btn btn-success" [disabled]="questionForm.invalid">
          <i class="bi bi-plus-square me-2"></i>Add Question
        </button>
      </form>
    </div>
  </div>

  <!-- عرض الامتحانات -->
  <div class="card shadow-sm">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Exams</h5>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li class="list-group-item" *ngFor="let exam of exams; trackBy: trackByFn">
          <strong>{{ exam.title }}</strong>
          <ul class="list-group mt-2" *ngIf="exam.questions?.length">
            <li class="list-group-item" *ngFor="let question of exam.questions; trackBy: trackByFn">
              {{ question.text }}
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- إضافة CSS مخصص لتحسين التنسيق -->
<style>
  .card {
    border-radius: 10px;
  }
  .card-header {
    border-radius: 10px 10px 0 0;
  }
  .form-control, .form-select {
    border-radius: 5px;
  }
  .btn {
    border-radius: 5px;
    transition: all 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .list-group-item {
    border-radius: 5px;
    margin-bottom: 5px;
  }
</style>
